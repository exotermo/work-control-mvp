services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workcontrol
      POSTGRES_USER: workcontrol
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workcontrol -d workcontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-local-only-admin-password}
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ../keycloak/realm-work-control-local.json:/opt/keycloak/data/import/realm-work-control-local.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    profiles: ["oidc"]

  migrate:
    image: migrate/migrate:v4.18.1
    volumes: ["../../services/api-go/migrations:/migrations"]
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://workcontrol:local-only@postgres:5432/workcontrol?sslmode=disable",
      ]
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../services/api-go
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: workcontrol
      POSTGRES_USER: workcontrol
      POSTGRES_PASSWORD: local-only
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      DEMO_SIMULATOR: "true"
      AUTH_MODE: dev
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  seed:
    build:
      context: ../../services/api-go
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: workcontrol
      POSTGRES_USER: workcontrol
      POSTGRES_PASSWORD: local-only
      SEED_DEV_DATA: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["dev"]
