# Modelo sem credenciais. Copiar para fora do repositório antes de preencher.
tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: work-control.xandehome.api.br
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 10s
  - service: http_status:404
